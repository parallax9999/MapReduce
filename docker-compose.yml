version: '3.8'

services:
  # Combined Boss + Client + Frontend container
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: mapreduce-controller
    ports:
      - "3000:3000"  # React Frontend (main access point)
      - "8080:8080"  # Boss gRPC server
      - "8081:8081"  # Client WebSocket/REST API
    volumes:
      - ./volume:/volume
    environment:
      - VOLUME_PATH=/volume
    networks:
      - mapreduce-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Worker 1
  worker1:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mapreduce-worker1
    depends_on:
      - controller
    volumes:
      - ./volume:/volume
    environment:
      - BOSS_ADDR=controller:8080
      - WORKER_SLOTS=1
      - VOLUME_PATH=/volume
    networks:
      - mapreduce-net
    restart: unless-stopped

  # Worker 2
  worker2:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mapreduce-worker2
    depends_on:
      - controller
    volumes:
      - ./volume:/volume
    environment:
      - BOSS_ADDR=controller:8080
      - WORKER_SLOTS=1
      - VOLUME_PATH=/volume
    networks:
      - mapreduce-net
    restart: unless-stopped

  # Worker 3
  worker3:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mapreduce-worker3
    depends_on:
      - controller
    volumes:
      - ./volume:/volume
    environment:
      - BOSS_ADDR=controller:8080
      - WORKER_SLOTS=1
      - VOLUME_PATH=/volume
    networks:
      - mapreduce-net
    restart: unless-stopped

  # Worker 4
  worker4:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mapreduce-worker4
    depends_on:
      - controller
    volumes:
      - ./volume:/volume
    environment:
      - BOSS_ADDR=controller:8080
      - WORKER_SLOTS=1
      - VOLUME_PATH=/volume
    networks:
      - mapreduce-net
    restart: unless-stopped

networks:
  mapreduce-net:
    driver: bridge
